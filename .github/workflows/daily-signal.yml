name: Daily lead-lag signal

# Runs the subspace-regularized PCA lead-lag model once per trading day and
# delivers the resulting long/short book by e-mail and/or Discord (see
# REPORT_CHANNELS below).
#
# Timing follows the paper's convention: the U.S. close-to-close return on
# day t predicts the Japanese open-to-close return on day t+1, so the book
# has to land after the U.S. close and before the Japanese open (09:00 JST
# = 00:00 UTC).
#
# GitHub's cron is best-effort and has been firing this job 1.5-7.5h late,
# i.e. after the Japanese open.  So instead of one slot the job is armed
# every 30 minutes from the U.S. close (20:00 UTC in EDT, 21:00 UTC in
# EST) to the Japanese open, and daily_report.py --auto decides what each
# run does from the real exchange calendars (market_calendar.py):
#
#   * the target is the next Tokyo session whose open is still ahead --
#     nothing is sent for a day Tokyo is shut, and nothing is sent late;
#   * the signal is the last U.S. close before that open (after a U.S.
#     holiday, the latest U.S. close; after a Japanese holiday, the U.S.
#     session Tokyo missed), used only once it is 15 minutes old;
#   * runs before that close settles, or after a book for that session
#     was already delivered (state kept in the Actions cache), exit
#     without sending.
#
# Each delivered book is saved under state/books/ in the same cache, and
# jp-close-review.yml scores exactly that book after the Japanese close.
#
# Note also that GitHub disables scheduled workflows in a repository with no
# activity for 60 days; push a commit or re-enable it from the Actions tab.

on:
  schedule:
    - cron: "17,47 20-23 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Signal date (YYYY-MM-DD). Empty = latest available."
        required: false
        type: string
      dry_run:
        description: "Render only, never open an SMTP connection"
        required: false
        type: boolean
        default: false
      offline:
        description: "Use the synthetic fallback instead of the network"
        required: false
        type: boolean
        default: false
      channels:
        description: "Delivery channels, comma-separated (email, discord). Empty = repo default (REPORT_CHANNELS variable, or 'discord' for this workflow)."
        required: false
        type: string
      auto:
        description: "Behave like a scheduled run (calendar-gated, send once per JP session). Ignores 'date'."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lead_lag_strategy_v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: lead_lag_strategy_v2/uv.lock

      - name: Install dependencies
        run: uv sync --extra live --frozen

      - name: Restore delivery state
        uses: actions/cache/restore@v4
        with:
          path: lead_lag_strategy_v2/state
          key: daily-signal-state-${{ github.run_id }}
          restore-keys: daily-signal-state-

      - name: Build flags
        id: flags
        env:
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          IN_AUTO: ${{ inputs.auto }}
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_OFFLINE: ${{ inputs.offline }}
          IN_CHANNELS: ${{ inputs.channels }}
        run: |
          flags=""
          if [ "$IS_SCHEDULE" = "true" ] || [ "$IN_AUTO" = "true" ]; then
            flags="$flags --auto --state-file state/last_sent.json --book-dir state/books"
          elif [ -n "$IN_DATE" ]; then
            flags="$flags --date $IN_DATE"
          fi
          if [ "$IN_DRY" = "true" ]; then flags="$flags --dry-run"; fi
          if [ -n "$IN_CHANNELS" ]; then flags="$flags --channels $IN_CHANNELS"; fi
          if [ "$IN_OFFLINE" = "true" ]; then
            # Manual pipeline test on synthetic data: no freshness check,
            # since simulated prices are never "today's market".
            flags="$flags --offline"
          fi
          # With --auto, a run that finds the U.S. close missing from
          # yfinance or live data unavailable sends nothing (never a stale
          # or synthetic book) and leaves the session to a later run.
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "Using flags:$flags"

      - name: Generate and send the daily signal
        id: report
        env:
          # Which channels to use when --channels wasn't passed above.
          # Comma-separated: "email", "discord", or "email,discord".
          # This workflow is deployed for Discord: with the REPORT_CHANNELS
          # repo variable unset, it defaults to "discord" here (note this
          # differs from daily_report.py's own script-level default of
          # "email" -- that default is for direct/manual invocation).
          # Set the REPORT_CHANNELS variable to override, e.g. to add email
          # back once SMTP_* secrets are configured.
          REPORT_CHANNELS: ${{ vars.REPORT_CHANNELS || 'discord' }}
          # Configure these as repository secrets to enable real e-mail
          # delivery. With SMTP_HOST unset the script falls back to a dry
          # run and the rendered message is uploaded as a build artifact.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          # Mock defaults live in the script; override with repository
          # variables (Settings -> Secrets and variables -> Actions -> Variables).
          REPORT_FROM: ${{ vars.REPORT_FROM }}
          REPORT_TO: ${{ vars.REPORT_TO }}
          # Discord webhook URL for the target channel (Secrets, since the
          # URL itself is a bearer credential -- see README section 5.5).
          # With this unset the script falls back to a dry run.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python daily_report.py ${{ steps.flags.outputs.flags }}

      - name: Save delivery state
        if: steps.report.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: lead_lag_strategy_v2/state
          key: daily-signal-state-${{ github.run_id }}

      - name: Upload rendered report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-signal-${{ github.run_id }}
          path: lead_lag_strategy_v2/output/
          if-no-files-found: ignore
          retention-days: 30
