name: JP close review

# Post-close counterpart to daily-signal.yml.  That job publishes the book
# before the Japanese open; this one scores it after the Japanese close and
# reports what each predicted ETF actually did -- the move in yen, the move
# in percent, and whether the predicted direction was right.
#
# Timing follows the same convention: the U.S. close-to-close return on day
# t predicts the Japanese open-to-close return on day t+1, so the review has
# to land after the Japanese close (15:30 JST = 06:30 UTC).
#
# Like the signal job, GitHub's cron fires this job hours late, so it is
# armed every 30 minutes from 07:17 to 12:47 UTC and review_report.py
# --auto decides what each run does (market_calendar.py):
#
#   * the target is the latest Tokyo session that closed >= 30 min ago;
#   * it is reviewed only if daily-signal.yml actually delivered a book
#     for it -- that saved book (state/books/, restored read-only from the
#     signal job's cache) is scored as delivered, not recomputed.  No book
#     (a holiday, or a day the signal missed the open) -> nothing is sent;
#   * a session already reviewed (this job's own cache) is not re-sent.
#
# Note also that GitHub disables scheduled workflows in a repository with no
# activity for 60 days; push a commit or re-enable it from the Actions tab.

on:
  schedule:
    - cron: "17,47 7-12 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Japanese session to review (YYYY-MM-DD). Empty = latest available."
        required: false
        type: string
      dry_run:
        description: "Render only, never send"
        required: false
        type: boolean
        default: false
      offline:
        description: "Use the synthetic fallback instead of the network"
        required: false
        type: boolean
        default: false
      channels:
        description: "Delivery channels, comma-separated (email, discord). Empty = repo default (REPORT_CHANNELS variable, or 'discord' for this workflow)."
        required: false
        type: string
      auto:
        description: "Behave like a scheduled run (review only a delivered book, once). Ignores 'date'."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jp-close-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lead_lag_strategy_v2

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: lead_lag_strategy_v2/uv.lock

      - name: Install dependencies
        run: uv sync --extra live --frozen

      - name: Restore delivered books (signal job's state, read-only)
        uses: actions/cache/restore@v4
        with:
          path: lead_lag_strategy_v2/state
          key: daily-signal-state-${{ github.run_id }}
          restore-keys: daily-signal-state-

      - name: Restore review state
        uses: actions/cache/restore@v4
        with:
          path: lead_lag_strategy_v2/review_state
          key: jp-close-review-state-${{ github.run_id }}
          restore-keys: jp-close-review-state-

      - name: Build flags
        id: flags
        env:
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          IN_AUTO: ${{ inputs.auto }}
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_OFFLINE: ${{ inputs.offline }}
          IN_CHANNELS: ${{ inputs.channels }}
        run: |
          flags=""
          if [ "$IS_SCHEDULE" = "true" ] || [ "$IN_AUTO" = "true" ]; then
            flags="$flags --auto --book-dir state/books --state-file review_state/last_reviewed.json"
          elif [ -n "$IN_DATE" ]; then
            flags="$flags --date $IN_DATE"
          fi
          if [ "$IN_DRY" = "true" ]; then flags="$flags --dry-run"; fi
          if [ -n "$IN_CHANNELS" ]; then flags="$flags --channels $IN_CHANNELS"; fi
          if [ "$IN_OFFLINE" = "true" ]; then
            # Manual pipeline test on synthetic data: no freshness check,
            # since simulated prices are never "today's market".
            flags="$flags --offline"
          fi
          # With --auto, a run with no delivered book for the session, no
          # live prices, or the session's bars not yet in yfinance sends
          # nothing and leaves it to a later run.
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "Using flags:$flags"

      - name: Score the book against the Japanese close
        id: review
        env:
          # Which channels to use when --channels wasn't passed above.
          # Same convention as daily-signal.yml: this workflow is deployed
          # for Discord, so with the REPORT_CHANNELS repo variable unset it
          # defaults to "discord" here (the script's own default is "email",
          # which is for direct/manual invocation).
          REPORT_CHANNELS: ${{ vars.REPORT_CHANNELS || 'discord' }}
          # Same secrets as the signal job -- nothing extra to configure.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
          REPORT_TO: ${{ vars.REPORT_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python review_report.py ${{ steps.flags.outputs.flags }}

      - name: Save review state
        if: steps.review.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: lead_lag_strategy_v2/review_state
          key: jp-close-review-state-${{ github.run_id }}

      - name: Upload rendered review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-close-review-${{ github.run_id }}
          path: lead_lag_strategy_v2/output/
          if-no-files-found: ignore
          retention-days: 30
